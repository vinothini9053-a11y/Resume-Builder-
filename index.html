<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Online Resume Builder</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <h1>&#128196; Online Resume Builder</h1>
    <div class="actions">
      <select id="template" aria-label="Template">
        <option value="classic">Classic</option>
        <option value="modern">Modern</option>
        <option value="minimal">Minimal</option>
      </select>
      <input type="color" id="accent" value="#2563eb" title="Accent colour">
      <button id="saveBtn" class="btn">Save</button>
      <button id="resetBtn" class="btn btn-light">Reset</button>
      <button id="printBtn" class="btn btn-green">Download PDF</button>
    </div>
  </header>

  <main class="layout">
    <!-- ================= FORM ================= -->
    <section class="panel" id="formPanel">
      <form id="resumeForm" novalidate>
        <fieldset>
          <legend>Personal Details</legend>
          <div class="grid">
            <label>Full Name *<input type="text" id="name" required placeholder="e.g. V. Vinothini"></label>
            <label>Job Title / Role<input type="text" id="role" placeholder="e.g. Web Developer (Fresher)"></label>
            <label>Email *<input type="email" id="email" required placeholder="name@example.com"></label>
            <label>Phone *<input type="tel" id="phone" required placeholder="10-digit mobile number"></label>
            <label>Address<input type="text" id="address" placeholder="City, State"></label>
            <label>LinkedIn / GitHub<input type="text" id="link" placeholder="github.com/username"></label>
            <label>Photo<input type="file" id="photo" accept="image/*"></label>
          </div>
          <p class="error" id="formError"></p>
        </fieldset>

        <fieldset>
          <legend>Career Objective</legend>
          <textarea id="summary" rows="3" placeholder="A short statement about your goals and strengths"></textarea>
        </fieldset>

        <fieldset>
          <legend>Education</legend>
          <div id="eduList"></div>
          <button type="button" class="btn btn-light" data-add="edu">+ Add Education</button>
        </fieldset>

        <fieldset>
          <legend>Skills</legend>
          <div class="skill-input">
            <input type="text" id="skillInput" placeholder="Type a skill and press Enter">
            <button type="button" class="btn" id="addSkill">Add</button>
          </div>
          <div id="skillTags" class="tags"></div>
        </fieldset>

        <fieldset>
          <legend>Projects</legend>
          <div id="projList"></div>
          <button type="button" class="btn btn-light" data-add="proj">+ Add Project</button>
        </fieldset>

        <fieldset>
          <legend>Experience / Internships</legend>
          <div id="expList"></div>
          <button type="button" class="btn btn-light" data-add="exp">+ Add Experience</button>
        </fieldset>

        <fieldset>
          <legend>Certifications &amp; Achievements</legend>
          <textarea id="certs" rows="3" placeholder="One item per line"></textarea>
        </fieldset>
      </form>
    </section>

    <!-- ================= PREVIEW ================= -->
    <section class="panel preview-wrap">
      <h2 class="no-print">Live Preview</h2>
      <article id="resume" class="resume classic"></article>
    </section>
  </main>

  <div id="toast" class="toast"></div>
  <script src="script.js"></script>
</body>
</html>
